<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="suit" x1="0" x2="1">
      <stop offset="0%" stop-color="#f2f6ff"/>
      <stop offset="100%" stop-color="#d9e4ff"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" x2="1">
      <stop offset="0%" stop-color="#8ad7ff"/>
      <stop offset="100%" stop-color="#3cb4ff"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="none"/>

  <!-- backpack -->
  <rect x="38" y="34" width="20" height="30" rx="6" fill="#d6dce8" stroke="#5d647a" stroke-width="3"/>
  <rect x="70" y="34" width="20" height="30" rx="6" fill="#d6dce8" stroke="#5d647a" stroke-width="3"/>
  <rect x="44" y="46" width="40" height="18" rx="5" fill="#99a9c7" opacity="0.9"/>

  <!-- legs -->
  <rect x="48" y="82" width="12" height="26" rx="5" fill="#dfeafc" stroke="#5d647a" stroke-width="3"/>
  <rect x="68" y="82" width="12" height="26" rx="5" fill="#dfeafc" stroke="#5d647a" stroke-width="3"/>
  <rect x="42" y="106" width="22" height="8" rx="4" fill="#585f72"/>
  <rect x="64" y="106" width="22" height="8" rx="4" fill="#585f72"/>

  <!-- body -->
  <path d="M40 56h48c8 0 14 6 14 14v20c0 10-8 18-18 18H44c-10 0-18-8-18-18V70c0-8 6-14 14-14z" fill="url(#suit)" stroke="#5d647a" stroke-width="3"/>

  <!-- chest details -->
  <rect x="53" y="66" width="22" height="18" rx="4" fill="#a8b8d7"/>
  <circle cx="64" cy="75" r="3.5" fill="#5d647a"/>
  <path d="M44 82h40" stroke="#b5c3dd" stroke-width="3" stroke-linecap="round"/>

  <!-- arms -->
  <rect x="22" y="62" width="12" height="32" rx="6" fill="#dfeafc" stroke="#5d647a" stroke-width="3" transform="rotate(-18 28 78)"/>
  <rect x="94" y="62" width="12" height="32" rx="6" fill="#dfeafc" stroke="#5d647a" stroke-width="3" transform="rotate(18 100 78)"/>

  <!-- hands -->
  <circle cx="29" cy="96" r="6" fill="#f4c9a5" stroke="#5d647a" stroke-width="2"/>
  <circle cx="99" cy="96" r="6" fill="#f4c9a5" stroke="#5d647a" stroke-width="2"/>

  <!-- head/helmet -->
  <circle cx="64" cy="32" r="20" fill="#f4c9a5" stroke="#5d647a" stroke-width="3"/>
  <path d="M46 32c0-11 8-20 18-20h6c10 0 18 9 18 20v4H46v-4z" fill="#dfeafc" stroke="#5d647a" stroke-width="3"/>
  <path d="M49 31c0-8 6-14 15-14h4c9 0 15 6 15 14v5H49v-5z" fill="url(#visor)" opacity="0.9"/>
  <circle cx="58" cy="33" r="2" fill="#1a2438"/>
  <circle cx="70" cy="33" r="2" fill="#1a2438"/>
  <path d="M59 40c2 2 8 2 10 0" stroke="#5d647a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- antenna -->
  <line x1="64" y1="12" x2="64" y2="-2" stroke="#5d647a" stroke-width="3"/>
  <circle cx="64" cy="8" r="4" fill="#f4b942" stroke="#5d647a" stroke-width="2"/>
</svg>
